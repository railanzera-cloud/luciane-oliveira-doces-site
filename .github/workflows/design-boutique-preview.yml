name: Preview Vitrine Editorial Experimental - Cloudflare
on:
  pull_request:
    branches:
      - design/luciane-editorial-vitrine-experiment-20261013
  push:
    branches:
      - design/luciane-boutique-v3-20261012
      - design/luciane-boutique-v4-20261013
      - design/luciane-editorial-vitrine-experiment-20261013
      - feature/pipocas-trufadas-pacotes-20261017
      - work/resultados-vendas-restaurados-trufadas-20261017
      - work/cozinha-alerta-modo-automatico-20261017
      - work/qz-tray-conexao-diagnostico-20261017
      - work/cozinha-completa-qz-assinado-20261017
      - work/etiqueta-premium-restaurada-cozinha-20261017
      - work/etiqueta-premium-confirmacao-pedido-20261017
      - work/cozinha-alertas-inteligentes-20261017
      - work/cozinha-windows-reconexao-estavel-20261017
      - work/whatsapp-trufadas-sem-pacote-20261018
      - work/trufadas-refinamento-premium-mobile-20261018
      - work/trufadas-experiencia-premium-viva-20261018
      - work/checkout-premium-unificado-20261018
    paths:
      - app/storefront-boutique.css
      - app/storefront-boutique-v3.css
      - app/storefront-vitrine-editorial-experiment.css
      - app/storefront-checkout-premium.css
      - app/catalog.ts
      - app/layout.tsx
      - app/page.tsx
      - app/order-checkout.ts
      - app/admin/page.tsx
      - app/globals.css
      - components/admin-results-panel.tsx
      - components/admin-orders-panel.tsx
      - lib/kitchen-alert.ts
      - lib/kitchen-print-health.ts
      - docs/COZINHA-ALERTAS-INTELIGENTES-20261017.md
      - docs/COZINHA-RECONEXAO-WINDOWS-20261017.md
      - lib/kitchen-auto-client.ts
      - lib/qz-print-client.ts
      - lib/qz-security.ts
      - docs/COZINHA-ASSINATURA-QZ-RETOMADA-20261017.md
      - docs/ETIQUETA-PREMIUM-RESTAURADA-20261017.md
      - supabase/migrations/20261017233000_kitchen_auto_mode_optin.sql
      - docs/COZINHA-AUTOMATICA-CONTINUIDADE-20261017.md
      - lib/admin-results-client.ts
      - lib/admin-results-model.ts
      - lib/admin-results-dates.ts
      - lib/admin-sales-client.ts
      - lib/admin-sales-model.ts
      - supabase/migrations/20261016220000_admin_results_custom_dates_v3.sql
      - supabase/migrations/20261016224500_admin_sales_summary_v1.sql
      - docs/RESULTADOS-RESTAURACAO-PACOTES-20261017.md
      - 'public/images/pipocas-trufadas-*.avif'
      - supabase/functions/create-whatsapp-order/index.ts
      - supabase/functions/_shared/commerce-catalog.mjs
      - supabase/migrations/20261014190000_crocantes_lancamento.sql
      - ESTADO_ATUAL_VITRINE.md
      # Todos os testes da vitrine ativam a CI; evita checkpoint sem ZIP.
      - 'tests/*.test.mjs'
      - tsconfig.boutique.json
      - .github/workflows/design-boutique-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://edqiwvccmboyayojvuea.supabase.co
      # Chave PUBLICA extraida do ZIP anteriormente publicado; sem secrets/service_role.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_69flK5d9m8Oe3HHVnmKWdA_omNIuIcl
      # Preserva o modo da versao anterior do Cloudflare (WhatsApp).
      SITE_ORDERING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit --project tsconfig.boutique.json
      - name: Suíte completa
        run: node --test tests/*.test.mjs
      - name: Gerar ZIP Cloudflare Pages
        run: node scripts/package-cloudflare.mjs --require-supabase
      - name: Validar conteudo do ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('outputs/luciane-oliveira-doces-cloudflare-pages.zip')
          assert p.is_file() and p.stat().st_size > 100000, 'ZIP ausente ou incompleto'
          with ZipFile(p) as z:
              assert z.testzip() is None, 'ZIP corrompido'
              names=set(z.namelist())
              mandatory={'index.html','admin/index.html','pedido/index.html','404.html','_worker.js','_routes.json','_headers'}
              assert mandatory <= names, 'faltam paginas/arquivos de deploy'
              assert len([x for x in names if x.startswith('assets/') and x.endswith('.js')]) > 5
              assert not any(x.startswith(('.env','supabase/','node_modules/')) for x in names)
              js='\n'.join(z.read(n).decode('utf8','replace') for n in names if n.startswith('assets/') and n.endswith('.js'))
              assert 'admin_get_tintim_order_tracking' in js, 'painel Tintim ausente'
              assert 'marketing_interactions' in js, 'historico de campanhas ausente'
              assert 'Rastreamento deste pedido' in js, 'resumo claro de rastreamento ausente'
              assert 'Mais informações do Tintim' in js, 'bloco Tintim ausente'
              assert 'Histórico de visitas identificadas' in js, 'rotulo de historico ausente'
              assert 'O identificador de clique deste pedido coincide' in js, 'evidencia de clique ausente'
              assert 'admin_get_tintim_order_tracking_v3' in js, 'consulta de historico por pedido ausente'
              assert 'admin_get_results_overview_v3' in js, 'consulta de Resultados com datas ausente'
              assert 'admin_get_sales_summary_v1' in js, 'consulta de vendas concluídas ausente'
              assert 'Personalizado' in js and 'Amanhã' in js and 'Hoje' in js, 'filtros flexíveis ausentes'
              assert 'Vendas concluídas e pagas' in js, 'visão de vendas ausente'
              assert 'admin_get_kitchen_auto_mode_v1' in js, 'controle da cozinha ausente'
              assert 'admin_set_kitchen_auto_mode_v1' in js, 'alternância de cozinha ausente'
              assert 'Este aviso desaparece sozinho' in js, 'aviso normal efemero ausente'
              assert 'Silenciar alerta por 5 minutos' in js, 'alerta de falha independente ausente'
              assert 'Atenção à impressão' in js, 'diagnóstico de falha na impressão ausente'
              assert 'Manter tela ativa durante a cozinha' in js, 'controle de Wake Lock ausente'
              assert 'Reconectando QZ Tray em segundo plano' in js, 'recuperação automática QZ ausente'
              assert 'Confira se o papel saiu antes de pedir reimpressão' in js, 'timeout seguro da impressão ausente'
              assert 'Reconhecer aviso e parar som' not in js, 'versao com reconhecimento manual retornou'
              assert 'PEDIDO CONFIRMADO' in js, 'comanda deve confirmar pedido sem exigir Pix'
              assert 'Conectando ao QZ Tray no notebook' in js, 'etapa local QZ ausente'
              assert 'QZ Tray não respondeu em 20 segundos' in js, 'timeout de QZ ausente'
              assert 'Certificado de impressão QZ ausente ou inválido' in js, 'certificado assinado QZ ausente'
              assert 'O Supabase retornou uma assinatura QZ inválida' in js, 'checagem de assinatura QZ ausente'
              assert 'ENDERECO DE ENTREGA' in js, 'endereco estruturado da comanda original ausente'
              assert 'REIMPRESSAO' in js and 'OBSERVACOES' in js, 'layout original ESC/POS ausente'
              assert 'PIX CONFIRMADO' in js and 'PEDIDO CONFIRMADO' in js, 'indicadores corretos da comanda ausentes'
              assert 'Modo Cozinha' in js and 'Ligar automático' in js, 'modo cozinha perdido na integração'
              assert 'Marcados como pagos no painel' in js, 'rotulo correto de pagamentos ausente'
              assert 'Campanhas registradas no Tintim' in js, 'visao de campanhas ausente'
              assert 'Sinais de anúncios' in js, 'aba de sinais ausente'
              assert 'Registros do site' in js, 'aba administrativa ausente'
              assert 'não significa acesso orgânico' in js, 'cautela de origem ausente'
              assert 'Desses, com identificador fbclid' in js, 'diagnostico link bio ausente'
              assert 'Sem confirmação de pagamento no site' in js, 'rotulo parcial das pendencias ausente'
              assert 'Campanha identificada em outra visita' in js, 'referencia de campanha anterior ausente'
              assert 'marketing_interactions' in js, 'historico nao compilado'
              assert 'https://edqiwvccmboyayojvuea.supabase.co' in js, 'Supabase ausente'
              assert 'sb_publishable_' in js, 'chave publica ausente'
              css='\n'.join(z.read(n).decode('utf8','replace') for n in names if n.startswith('assets/') and n.endswith('.css'))
              assert 'admin-kitchen-incoming' in css, 'alerta visual de cozinha ausente'
              assert '--boutique-night' in css, 'paleta boutique nao compilada'
              assert 'boutique-checkout-progress' in css, 'navegacao de checkout ausente'
              assert 'boutique-flavor-impact' in css, 'impacto de preco da combinacao ausente'
              assert 'boutique-slice-card-footer' in css, 'vitrine de fatias ausente'
              assert 'boutique-cart-image' in css, 'fotografia do carrinho ausente'
              assert 'Preço do pote com este sabor' in js, 'preco individual por sabor ausente'
              assert 'Pote fica ' in js, 'preco final da combinacao ausente'
              assert 'Valor por pacote' in js, 'subtotal contextual trufadas ausente'
              assert 'limited-cup-buy-composition' in css, 'refinamento premium trufadas ausente'
              assert 'limited-cup-card-check' in css, 'estado premium de selecao trufadas ausente'
              assert 'limited-cup-more-intro' in js, 'cross-sell de categorias ausente'
              assert 'trufadas-subtotal-update' in css, 'microinteracao de subtotal ausente'
              assert 'checkout-premium-20261018' in css, 'camada premium checkout ausente'
              assert 'is-checkout-flow' in js, 'barra visual checkout ausente'
              assert 'boutique-final-action' in js, 'regiao de CTA contextual ausente'
              assert 'category-option-media' in css, 'cartoes fotograficos ausentes'
              assert 'prefers-reduced-motion' in css, 'acessibilidade de movimento ausente'
              assert 'storefront' in css, 'escopo de estilo ausente'
              assert 'Sinais de anúncios' in js, 'CRM e rastreamento devem permanecer'
              print('ARQUIVOS:',len(names))
          print('SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          print('COMMIT:',Path('.git/HEAD').read_text().strip())
          PY
      - name: Publicar ZIP de build como artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: luciane-cloudflare-preview-vitrine-editorial-experiment
          path: outputs/luciane-oliveira-doces-cloudflare-pages.zip
          if-no-files-found: error
          retention-days: 7
