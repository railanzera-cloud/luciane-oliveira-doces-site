name: Validar rastreamento e promoção
on:
  push:
    branches:
      - feature/tintim-tracking-bridge-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Tipos Cloudflare para validação isolada
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @cloudflare/workers-types@4
          printf '%s\n' '/// <reference types="@cloudflare/workers-types" />' > cloudflare-ci-types.d.ts
          printf '%s\n' 'interface Env { DB: D1Database; }' >> cloudflare-ci-types.d.ts
      - name: TypeScript (diferenciar 2 falhas preexistentes de binding D1)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/luciane-tsc.log 2>&1
          result=$?
          set -e
          cat /tmp/luciane-tsc.log
          if [ "$result" -ne 0 ]; then
            total=$(grep -c "error TS" /tmp/luciane-tsc.log || true)
            known=$(grep -E -c "^db/index\.ts\([0-9]+,[0-9]+\): error TS2339: Property 'DB' does not exist on type 'Env'\." /tmp/luciane-tsc.log || true)
            if [ "$total" -ne 2 ] || [ "$known" -ne 2 ]; then
              echo "Erros TypeScript novos ou inesperados; falha de CI."
              exit 1
            fi
            echo "2 erros preexistentes de tipos de binding D1 isolados, sem outros erros TypeScript."
          fi
      - name: Testes
        run: node --test tests/*.test.mjs
      - name: Build de validação sem deploy
        run: npm run build
