name: Cozinha QZ — preparação isolada (sem deploy)

on:
  push:
    branches:
      - work/cozinha-qz-fila-segura-20261014
      - work/cozinha-integracao-segura-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --project tsconfig.boutique.json
      - name: Teste focal da fila sem banco real
        run: node --test tests/kitchen-print-preparation.test.mjs
      - name: Build (sem publicar)
        run: npm run build
      - name: Suite de regressão
        run: node --test tests/*.test.mjs

  sql-fila:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kitchen-ci-only
          POSTGRES_DB: kitchen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kitchen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: kitchen-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Montar schema sintético
        run: psql -h 127.0.0.1 -U postgres -d kitchen_test -v ON_ERROR_STOP=1 -f tests/sql/kitchen-print-ephemeral-schema.sql
      - name: Executar migração no banco efêmero
        run: psql -h 127.0.0.1 -U postgres -d kitchen_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261014230000_kitchen_print_preparation_DISABLED.sql
      - name: Simular pedidos e fila segura
        run: psql -h 127.0.0.1 -U postgres -d kitchen_test -v ON_ERROR_STOP=1 -f tests/sql/kitchen-print-ephemeral-assertions.sql
