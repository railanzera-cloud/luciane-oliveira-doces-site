name: CRM comercial - testes de fila e tipagem

on:
  push:
    branches:
      - feature/crm-operacao-comercial-priorizada-20261114
      - integrate/crm-v47143-legal-comercial-20261115
    paths:
      - components/admin-crm-panel.*
      - app/catalog.ts
      - app/page.tsx
      - lib/crm-operacao.ts
      - lib/crm-follow-up.ts
      - tests/crm-operacao.test.mjs
      - .github/workflows/crm-commercial-operations.yml
      - docs/CRM-OPERACAO-COMERCIAL-20261115.md
      - docs/continuidade/CHECKPOINT-VIVO.md
  pull_request:
    paths:
      - components/admin-crm-panel.*
      - app/catalog.ts
      - app/page.tsx
      - lib/crm-operacao.ts
      - lib/crm-follow-up.ts
      - tests/crm-operacao.test.mjs
      - .github/workflows/crm-commercial-operations.yml
      - docs/CRM-OPERACAO-COMERCIAL-20261115.md
      - docs/continuidade/CHECKPOINT-VIVO.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Unit tests for safe CRM operations
        run: node --experimental-strip-types --test tests/crm-operacao.test.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: CRM-only TypeScript check (isolated from pre-existing errors)
        run: npx tsc --project tsconfig.crm-check.json --noEmit
      - name: Build frontend (without deploy)
        run: npm run build
      - name: Commercial regression suite (without sending or deploying)
        run: node --test tests/*.test.mjs
