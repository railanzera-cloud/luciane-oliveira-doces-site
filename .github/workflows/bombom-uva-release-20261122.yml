name: Bombom de Uva R$22 — pacote conectado V4.7.15.9 (sem deploy)
on:
  push:
    branches:
      - fix/fatia-bombom-uva-r22-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-approved:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: "https://edqiwvccmboyayojvuea.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_69flK5d9m8Oe3HHVnmKWdA_omNIuIcl"
      SITE_ORDERING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Compilar site conectado ao Supabase comercial
        run: npm run build
      - name: Verificar regressões comerciais
        run: node --test tests/*.test.mjs
      - name: Preparar rotas e assets conectados
        run: node scripts/build-crm-commercial-core.mjs
      - name: Verificar aprovação, catálogo, mídias e integridade do pacote
        shell: bash
        run: |
          node scripts/package-bombom-uva-r22-20261122.mjs | tee outputs/RELEASE-V47159.json
          sha256sum outputs/LUCIANE_DOCES_V4_7_15_9_BOMBOM_UVA_R22_CLOUDFLARE.zip > outputs/RELEASE-V47159.sha256
      - name: Disponibilizar pacote aprovado sem realizar deploy
        uses: actions/upload-artifact@v4
        with:
          name: LUCIANE-DOCES-V47159-BOMBOM-UVA-R22-CLOUDFLARE
          path: |
            outputs/LUCIANE_DOCES_V4_7_15_9_BOMBOM_UVA_R22_CLOUDFLARE.zip
            outputs/RELEASE-V47159.json
            outputs/RELEASE-V47159.sha256
          retention-days: 30
          if-no-files-found: error
