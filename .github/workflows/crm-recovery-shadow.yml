name: CRM recovery shadow - isolated checks
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/recovery-*.mjs'
      - 'supabase/functions/_shared/commerce-catalog.mjs'
      - 'supabase/functions/_shared/trufadas-variants.mjs'
      - 'supabase/functions/_shared/drinks-catalog.mjs'
      - 'supabase/functions/crm-whatsapp-webhook/core.mjs'
      - 'supabase/functions/crm-whatsapp-webhook/index.ts'
      - 'supabase/functions/crm-recovery-reevaluate/**'
      - 'supabase/migrations/*crm_recovery_due_shadow.sql'
      - 'supabase/migrations/*crm_recovery_scheduler_auth.sql'
      - 'supabase/migrations/*crm_recovery_purchase_episodes.sql'
      - 'supabase/migrations/*crm_recovery_official_order_references.sql'
      - 'supabase/migrations/*crm_recovery_site_purchase_episodes.sql'
      - 'supabase/migrations/*crm_recovery_context_permissions.sql'
      - 'supabase/migrations/*crm_recovery_context_permission_uses.sql'
      - 'tests/fixtures/recovery-postgres-client.mjs'
      - 'tests/fixtures/recovery-permission-database.mjs'
      - 'tests/crm-recovery-context-permission-concurrency-20261118.integration.mjs'
      - 'tests/crm-recovery-context-permission-20261118.test.mjs'
      - 'tests/crm-recovery-context-permission-postgres-20261118.test.mjs'
      - 'supabase/prepared/recovery-site-episodes-restore-functions.sql'
      - 'cloudflare/recovery-scheduler/**'
      - 'scripts/build-recovery-scheduler-dashboard.mjs'
      - 'tests/crm-recovery-scheduler*.test.mjs'
      - 'tests/fixtures/recovery-scheduler.mjs'
      - 'tests/crm-recovery-due*.test.mjs'
      - 'scripts/recovery-shadow-replay.mjs'
      - 'tests/crm-recovery-shadow-20261115.test.mjs'
      - 'tests/crm-recovery-snapshot-20261116.test.mjs'
      - 'tests/crm-recovery-purchase-signal-20261117.test.mjs'
      - 'tests/crm-recovery-order-reference-20261117.test.mjs'
      - 'tests/crm-recovery-order-reference-postgres-20261117.test.mjs'
      - 'tests/crm-recovery-purchase-episode-20261117.test.mjs'
      - 'tests/crm-recovery-site-purchase-episode-20261118.test.mjs'
      - 'tests/crm-recovery-episodes-postgres-20261117.test.mjs'
      - 'tests/crm-recovery-tintim-purchase-postgres-20261117.test.mjs'
      - 'tests/crm-recovery-ingress-20261116.test.mjs'
      - 'tests/crm-recovery-server-client-20261116.test.mjs'
      - 'tests/crm-recovery-private-20261116.test.mjs'
      - 'supabase/prepared/recovery-private-observations.sql'
      - '.github/workflows/crm-recovery-shadow.yml'
  push:
    branches: ['feat/crm-recovery-shadow-20261115']
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lod_permission_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies for real PostgreSQL tests
        run: npm ci --no-audit --no-fund
      - name: Verify generated dashboard artifact
        run: node scripts/build-recovery-scheduler-dashboard.mjs --check
      - name: Catalog, business decisions and signed webhook replay
        run: >-
          node --test tests/crm-recovery-shadow-20261115.test.mjs
          tests/crm-recovery-snapshot-20261116.test.mjs
          tests/crm-recovery-context-permission-20261118.test.mjs
          tests/crm-recovery-context-permission-postgres-20261118.test.mjs
          tests/crm-recovery-purchase-signal-20261117.test.mjs
          tests/crm-recovery-order-reference-20261117.test.mjs
          tests/crm-recovery-order-reference-postgres-20261117.test.mjs
          tests/crm-recovery-purchase-episode-20261117.test.mjs
          tests/crm-recovery-site-purchase-episode-20261118.test.mjs
          tests/crm-recovery-episodes-postgres-20261117.test.mjs
          tests/crm-recovery-tintim-purchase-postgres-20261117.test.mjs
          tests/crm-recovery-ingress-20261116.test.mjs
          tests/crm-recovery-server-client-20261116.test.mjs
          tests/crm-recovery-private-20261116.test.mjs
          tests/crm-recovery-due-20261116.test.mjs
          tests/crm-recovery-due-postgres-20261116.test.mjs
          tests/crm-recovery-scheduler-20261116.test.mjs
          tests/crm-recovery-scheduler-postgres-20261116.test.mjs
          tests/crm-recovery-scheduler-workerd-20261117.test.mjs
          tests/crm-observabilidade-meta-20261026.test.mjs
          tests/crm-tintim-receipt-time-20261026.test.mjs
          tests/crm-meta-delivery-status-20261027.test.mjs
          tests/crm-whatsapp-official-transport-20261027.test.mjs
      - name: Independent PostgreSQL connections - no production access
        env:
          LOD_LOCAL_POSTGRES_TEST: '1'
          PGPASSWORD: synthetic-local-test-password
        run: node --test tests/crm-recovery-context-permission-concurrency-20261118.integration.mjs
